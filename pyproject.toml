[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-memory"
version = "0.1.0"
description = "Model-agnostic persistent memory layer for LLMs via MCP"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",       # async HTTP for pluggable LLM compaction calls
    "rich>=13.0.0",        # CLI pretty output
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
memory-mcp = "mcp_server.server:main"
memory    = "cli.main:app"
memory-gui = "gui.server:main"

[tool.hatch.build.targets.wheel]
packages = ["memory", "mcp_server", "cli", "gui"]
